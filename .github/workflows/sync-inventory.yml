name: Sync inventory from Dropbox

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 Pillow==13.0.0 pillow-heif==1.8.1
      - name: Pull and clean plant photos from the Dropbox photo folder
        continue-on-error: true   # if the photo folder is unreachable, still update the inventory
        env:
          DROPBOX_PHOTOS_URL: ${{ secrets.DROPBOX_PHOTOS_URL }}
        run: python scripts/sync_photos.py
      - name: Build data/inventory.csv from the Dropbox sheet
        env:
          DROPBOX_INVENTORY_URL: ${{ secrets.DROPBOX_INVENTORY_URL }}
          SHEET_NAME: ${{ vars.SHEET_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/sync_inventory.py
      - name: Remember when each plant and event first appeared (for the Monday email)
        run: python scripts/track_arrivals.py
      - name: Build a real page for every plant in stock (and delete pages of plants that are gone)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_plants.py "$SITE_URL"
      - name: Refresh sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_sitemap.py "$SITE_URL"
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data assets plants sitemap.xml shop.html)" ]; then
            git config user.name "inventory-sync"
            git config user.email "inventory-sync@users.noreply.github.com"
            git add -A data assets plants sitemap.xml shop.html
            git commit -m "Sync inventory from Dropbox"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes"
          fi
