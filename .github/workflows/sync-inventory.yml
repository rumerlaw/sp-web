name: Sync inventory from Dropbox

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Build data/inventory.csv from the Dropbox sheet
        env:
          DROPBOX_INVENTORY_URL: ${{ secrets.DROPBOX_INVENTORY_URL }}
          SHEET_NAME: ${{ vars.SHEET_NAME }}
        run: python scripts/sync_inventory.py
      - name: Refresh sitemap
        run: python scripts/build_sitemap.py ${{ vars.SITE_URL }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data sitemap.xml)" ]; then
            git config user.name "inventory-sync"
            git config user.email "inventory-sync@users.noreply.github.com"
            git add data/inventory.csv sitemap.xml
            git commit -m "Sync inventory from Dropbox"
            git push
          else
            echo "No changes"
          fi
